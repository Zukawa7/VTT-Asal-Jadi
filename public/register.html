<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - VTT Asal Jadi</title>
  <link class="stylesheet" href="/styles/tailwind.css">
  <!-- Correct stylesheet link type -->
  <link rel="stylesheet" href="/styles/tailwind.css">
</head>
<body class="bg-[#0a0b10] text-white min-h-screen">
  <main class="relative min-h-screen overflow-hidden bg-[#0a0b10] flex items-center justify-center p-6 sm:p-[60px]">
    <!-- DarkModeToggle -->
    <button
      type="button"
      data-theme-toggle
      class="absolute right-6 top-6 z-20 flex items-center gap-2 rounded-full border border-[#26293c] bg-[#121420] px-3 py-3 text-white transition-colors hover:bg-[#181c2c] sm:right-10 sm:top-10"
    >
      <i data-lucide="moon" class="h-4 w-4"></i>
      <span class="text-xs font-normal">DARK MODE</span>
    </button>

    <!-- BackgroundGlow -->
    <div
      aria-hidden="true"
      class="pointer-events-none absolute left-1/2 top-1/2 h-[600px] w-[600px] max-w-none -translate-x-1/2 -translate-y-[340px] rounded-full"
      style="background: radial-gradient(circle, rgba(212,165,68,0.18) 0%, rgba(212,165,68,0.06) 35%, transparent 70%);"
    ></div>

    <div class="relative z-10 w-full max-w-[460px] rounded-2xl border border-[#26293c] bg-[#121420] p-8 shadow-2xl sm:p-12">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full border border-[#d4a544] bg-[#181c2c]">
          <i data-lucide="users" class="h-5 w-5 text-[#d4a544]"></i>
        </div>
        <h3 class="text-2xl font-extrabold text-white" style="font-family: 'EB Garamond', serif;">CREATE ACCOUNT</h3>
        <p class="mt-2 text-xs text-[#a2a7bd]">Enter your player campaign details</p>
      </div>

      <form id="registerForm" class="space-y-4">
        <!-- Username -->
        <label class="block">
          <span class="mb-2 block text-[10px] font-bold uppercase tracking-wider text-[#e5c284]">USERNAME</span>
          <input
            type="text"
            id="username"
            required
            placeholder="Choose a username"
            class="w-full rounded-md border border-[#26293c] bg-[#0b0c12] px-3 py-2.5 text-xs text-white outline-none placeholder:text-[#555b70] focus:border-[#d4a544]"
          />
        </label>

        <!-- Password -->
        <label class="block">
          <span class="mb-2 block text-[10px] font-bold uppercase tracking-wider text-[#e5c284]">PASSWORD</span>
          <input
            type="password"
            id="password"
            required
            placeholder="Choose a password"
            class="w-full rounded-md border border-[#26293c] bg-[#0b0c12] px-3 py-2.5 text-xs text-white outline-none placeholder:text-[#555b70] focus:border-[#d4a544]"
          />
        </label>

        <!-- Terms Agree -->
        <label class="flex items-start gap-2 text-[11px] leading-5 text-[#6b7085]">
          <input type="checkbox" id="termsAgree" required class="mt-1 accent-[#d4a544]" />
          <span>I agree to the terms of service and privacy policy.</span>
        </label>

        <!-- Error & Success Messages -->
        <div id="registerError" class="hidden text-sm text-red-500 text-center bg-red-950/20 border border-red-900/50 rounded-lg p-3"></div>
        <div id="registerSuccess" class="hidden text-sm text-green-500 text-center bg-green-950/20 border border-green-900/50 rounded-lg p-3"></div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full rounded-md bg-[#d4a544] py-3 text-xs font-bold text-[#0a0b10] transition hover:bg-[#e5c284]"
        >
          CREATE ACCOUNT
        </button>
      </form>

      <p class="mt-6 text-center text-xs text-[#6b7085]">
        Already have an account? <a href="/login" class="text-[#d4a544] hover:text-[#e5c284] font-bold">Sign in here</a>
      </p>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard';
    }

    const registerForm = document.getElementById('registerForm');
    const registerError = document.getElementById('registerError');
    const registerSuccess = document.getElementById('registerSuccess');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerError.classList.add('hidden');
      registerSuccess.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/v2/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : { error: `Register endpoint returned ${response.status} ${response.statusText}` };
          
        if (!response.ok) throw new Error(data.error || 'Registration failed');

        registerSuccess.textContent = 'Account created successfully! Redirecting to login...';
        registerSuccess.classList.remove('hidden');
        
        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);
      } catch (err) {
        registerError.textContent = err.message;
        registerError.classList.remove('hidden');
      }
    });
  </script>
  <script src="/js/components.js"></script>
  <script src="/js/theme-toggle.js"></script>
</body>
</html>
