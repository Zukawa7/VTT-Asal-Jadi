<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - VTT Asal Jadi</title>
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/animations.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/responsive.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="card card-fantasy w-full" style="max-width: 420px;">
    <!-- Fantasy Crest Header -->
    <div class="text-center" style="margin-bottom: var(--space-lg);">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(145deg, var(--bg-tertiary), var(--bg-surface)); border: 2px solid var(--gold-500); box-shadow: var(--glow-gold-sm); margin-bottom: var(--space-sm);">
        <span style="font-size: var(--font-size-3xl); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));">⚔️</span>
      </div>
      <h1 class="card-title" style="border: none; margin-top: var(--space-xs); font-size: var(--font-size-2xl);">VTT ASAL JADI</h1>
      <p style="color: var(--text-secondary); font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: var(--tracking-wider); margin-top: 4px;">Create your adventurer account</p>
    </div>

    <form id="registerForm" class="flex flex-col gap-4">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" required placeholder="Choose a username" class="input form-input">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" required placeholder="Choose a password" class="input form-input">
      </div>

      <div class="flex items-center" style="margin-top: -4px;">
        <label class="form-checkbox-container text-xs" style="color: var(--text-secondary);">
          <input type="checkbox" id="termsAgree" required class="form-checkbox">
          <span>I agree to the Terms & Conditions</span>
        </label>
      </div>

      <div id="registerError" class="hidden" style="color: var(--danger); font-size: var(--font-size-sm); text-align: center; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); border-radius: var(--radius-sm); padding: var(--space-xs);"></div>
      <div id="registerSuccess" class="hidden" style="color: var(--success); font-size: var(--font-size-sm); text-align: center; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); border-radius: var(--radius-sm); padding: var(--space-xs);"></div>

      <button type="submit" class="btn btn-primary w-full" style="margin-top: var(--space-sm);">
        Create Account
      </button>
    </form>

    <div style="margin-top: var(--space-lg); text-align: center; font-size: var(--font-size-sm); color: var(--text-secondary); border-top: 1px solid var(--border-primary); padding-top: var(--space-md);">
      Already have an account? 
      <a href="/login" style="color: var(--gold-400); text-decoration: none; font-weight: bold;">Sign in here</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard';
    }

    const registerForm = document.getElementById('registerForm');
    const registerError = document.getElementById('registerError');
    const registerSuccess = document.getElementById('registerSuccess');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerError.classList.add('hidden');
      registerSuccess.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/v2/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : { error: `Register endpoint returned ${response.status} ${response.statusText}` };
          
        if (!response.ok) throw new Error(data.error || 'Registration failed');

        registerSuccess.textContent = 'Account created successfully! Redirecting to login...';
        registerSuccess.classList.remove('hidden');
        
        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);
      } catch (err) {
        registerError.textContent = err.message;
        registerError.classList.remove('hidden');
      }
    });
  </script>

  <script src="/js/components.js"></script>
  <script src="/js/theme-toggle.js"></script>
  <div style="position:fixed;bottom:10px;right:10px;z-index:var(--z-tooltip);"><button data-theme-toggle class="btn btn-ghost">🌙</button></div>
</body>
</html>
