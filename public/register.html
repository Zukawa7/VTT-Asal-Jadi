<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - VTT Asal Jadi</title>
  
  <!-- NEW CSS System -->
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/animations.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/responsive.css">
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="card w-full" style="max-width: 400px;">
    <div class="text-center" style="margin-bottom: var(--space-xl);">
      <span style="font-size: var(--font-size-3xl);">🎲</span>
      <h1 class="card-title" style="border: none;">VTT ASAL JADI</h1>
      <p style="color: var(--text-secondary); font-size: var(--font-size-sm);">Create your account</p>
    </div>

    <form id="registerForm" class="flex flex-col gap-4">
      <div>
        <label for="username" style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: var(--font-size-xs); text-transform: uppercase; font-weight: bold;">Username</label>
        <input type="text" id="username" required class="input">
      </div>

      <div>
        <label for="password" style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: var(--font-size-xs); text-transform: uppercase; font-weight: bold;">Password</label>
        <input type="password" id="password" required class="input">
      </div>

      <div id="registerError" class="hidden" style="color: var(--danger); font-size: var(--font-size-sm); text-align: center;"></div>
      <div id="registerSuccess" class="hidden" style="color: var(--success); font-size: var(--font-size-sm); text-align: center;"></div>

      <button type="submit" class="btn btn-primary w-full" style="margin-top: var(--space-md);">
        Create Account
      </button>
    </form>

    <div style="margin-top: var(--space-lg); text-align: center; font-size: var(--font-size-sm); color: var(--text-secondary);">
      Already have an account? 
      <a href="/login" style="color: var(--secondary); text-decoration: none;">Sign in here</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard';
    }

    const registerForm = document.getElementById('registerForm');
    const registerError = document.getElementById('registerError');
    const registerSuccess = document.getElementById('registerSuccess');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerError.classList.add('hidden');
      registerSuccess.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/v2/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : { error: `Register endpoint returned ${response.status} ${response.statusText}` };
          
        if (!response.ok) throw new Error(data.error || 'Registration failed');

        registerSuccess.textContent = 'Account created successfully! Redirecting to login...';
        registerSuccess.classList.remove('hidden');
        
        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);
      } catch (err) {
        registerError.textContent = err.message;
        registerError.classList.remove('hidden');
      }
    });
  </script>

  <script src="/js/components.js"></script>
  <script src="/js/theme-toggle.js"></script>
  <div style="position:fixed;bottom:10px;right:10px;z-index:var(--z-tooltip);"><button data-theme-toggle class="btn btn-ghost">🌙</button></div>
</body>
</html>
