<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VTT Asal Jadi</title>
  
  <!-- NEW CSS System -->
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/animations.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/responsive.css">
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="card w-full" style="max-width: 400px;">
    <div class="text-center" style="margin-bottom: var(--space-xl);">
      <span style="font-size: var(--font-size-3xl);">🎲</span>
      <h1 class="card-title" style="border: none;">VTT ASAL JADI</h1>
      <p style="color: var(--text-secondary); font-size: var(--font-size-sm);">Sign in to manage your D&D Beyond characters</p>
    </div>

    <form id="loginForm" class="flex flex-col gap-4">
      <div>
        <label for="username" style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: var(--font-size-xs); text-transform: uppercase; font-weight: bold;">Username</label>
        <input type="text" id="username" required autocomplete="username" class="input">
      </div>

      <div>
        <label for="password" style="display: block; margin-bottom: var(--space-xs); color: var(--text-secondary); font-size: var(--font-size-xs); text-transform: uppercase; font-weight: bold;">Password</label>
        <input type="password" id="password" required autocomplete="current-password" class="input">
      </div>

      <div id="loginError" class="hidden" style="color: var(--danger); font-size: var(--font-size-sm); text-align: center;"></div>

      <button type="submit" class="btn btn-primary w-full" style="margin-top: var(--space-md);">
        Sign In
      </button>
    </form>

    <div style="margin-top: var(--space-lg); text-align: center; font-size: var(--font-size-sm); color: var(--text-secondary);">
      Don't have an account? 
      <a href="/register" style="color: var(--secondary); text-decoration: none;">Register here</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard';
    }

    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/v2/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : { error: `Login endpoint returned ${response.status} ${response.statusText}` };
        if (!response.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        window.location.href = '/dashboard';
      } catch (err) {
        loginError.textContent = err.message;
        loginError.classList.remove('hidden');
      }
    });
  </script>

  <script src="/js/components.js"></script>
  <script src="/js/theme-toggle.js"></script>
  <div style="position:fixed;bottom:10px;right:10px;z-index:var(--z-tooltip);"><button data-theme-toggle class="btn btn-ghost">🌙</button></div>
</body>
</html>
