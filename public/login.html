<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VTT Asal Jadi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #12131a;
      color: #e2e8f0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-lg p-8 shadow-2xl max-w-md w-full">
    <div class="text-center mb-8">
      <span class="text-5xl">🎲</span>
      <h1 class="text-3xl font-bold text-amber-500 tracking-wider mt-3">VTT ASAL JADI</h1>
      <p class="text-sm text-gray-400 mt-1">Sign in to manage your D&D Beyond characters</p>
    </div>

    <form id="loginForm" class="space-y-6">
      <div>
        <label for="username" class="block text-xs font-bold uppercase text-gray-400 tracking-wider mb-2">Username</label>
        <input type="text" id="username" required autocomplete="username" class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-2 text-white focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label for="password" class="block text-xs font-bold uppercase text-gray-400 tracking-wider mb-2">Password</label>
        <input type="password" id="password" required autocomplete="current-password" class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-2 text-white focus:outline-none focus:border-amber-500">
      </div>

      <div id="loginError" class="hidden text-red-500 text-sm text-center"></div>

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded transition-all">
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-400">
      Don't have an account? 
      <a href="/register" class="text-amber-500 hover:underline">Register here</a>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard';
    }

    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/v2/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const contentType = response.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : { error: `Login endpoint returned ${response.status} ${response.statusText} instead of JSON` };
        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Save token and username
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);

        // Redirect to dashboard
        window.location.href = '/dashboard';
      } catch (err) {
        loginError.textContent = err.message;
        loginError.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
