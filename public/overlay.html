<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTT Asal Jadi - OBS Broadcast Overlay</title>
  
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/styles/tailwind.css">
  <style>
    body { background-color: transparent !important; color: #ffffff; overflow: hidden; margin: 0; padding: 1rem; }
    body.position-top { justify-content: flex-start; }
    body.position-center { justify-content: center; }
    body.position-bottom { justify-content: flex-end; }
    
    body.animation-slide .roll-card { animation-name: slideIn; }
    body.animation-fade .roll-card { animation-name: fadeIn; }
    body.animation-bounce .roll-card { animation-name: bounceIn; }
    
    body.font-small .result { font-size: 1.25rem; }
    body.font-medium .result { font-size: 1.5rem; }
    body.font-large .result { font-size: 2.25rem; }
    
    .roll-card { animation-duration: .3s; animation-fill-mode: forwards; }
    .roll-card.fade-out { animation: fadeOut .5s ease-out forwards; }
    
    @keyframes fadeIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }
    @keyframes bounceIn { 0% { opacity:0; transform:scale(.7); } 70% { transform:scale(1.05); } 100% { opacity:1; transform:scale(1); } }
    @keyframes slideIn { from { opacity:0; transform:translateY(20px) scale(.95); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes fadeOut { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-20px); } }
  </style>
</head>
<body class="h-screen w-screen p-4 flex flex-col justify-end">
  <div id="feed" class="w-full max-w-[380px] space-y-3 flex flex-col justify-end overflow-hidden"></div>
  <script src="/overlay.js"></script>
</body>
</html>
