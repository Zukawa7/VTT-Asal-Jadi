<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1A1617">
  <title>VTT Asal Jadi - D&D Beyond VTT</title>
  
  <!-- NEW CSS System (remove Tailwind CDN) -->
  <link rel="stylesheet" href="/styles/variables.css?v=5">
  <link rel="stylesheet" href="/styles/animations.css?v=5">
  <link rel="stylesheet" href="/styles/components.css?v=5">
  <link rel="stylesheet" href="/styles/theme.css?v=5">
  <link rel="stylesheet" href="/styles/responsive.css?v=5">
  
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  
  <style>
    body {
      background-color: #12131a;
      color: #e2e8f0;
    }
    .vtt-grid {
      background-size: calc(100% / 12) calc(100% / 12);
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- HEADER -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center flex-wrap gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🎲</span>
        <div>
          <h1 class="text-2xl font-bold text-amber-500">VTT ASAL JADI</h1>
          <p class="text-xs text-gray-400">D&D Beyond Integration & OBS Overlay</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <button data-theme-toggle class="btn btn-ghost">🌙</button>
        <div>
          <label class="block text-xs text-gray-400 font-bold">Room ID</label>
          <input type="text" id="roomIdInput" value="default-room" class="input w-36" />
        </div>
        <button id="joinRoomBtn" class="btn btn-accent">Connect Room</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- LEFT COLUMN: Character Sheet -->
    <div class="lg:col-span-3 flex flex-col gap-6">
      <div class="card">
        <h2 class="card-title">📥 Import Character</h2>
        <p class="text-xs text-gray-400 mb-4">Enter your D&D Beyond character ID</p>
        <div class="flex gap-2">
          <input type="text" id="charIdInput" placeholder="Character ID" class="input flex-1" />
          <button id="importBtn" class="btn btn-primary">Import</button>
        </div>
      </div>

      <div id="charSheet" class="hidden card flex-1 flex flex-col gap-4">
        <div class="flex items-center gap-4 pb-4 border-b border-gray-800">
          <img id="charAvatar" src="" alt="Avatar" class="w-16 h-16 rounded-full border-2 border-amber-500" />
          <div>
            <h2 id="charName" class="text-xl font-bold text-white">Character</h2>
            <p id="charSub" class="text-sm text-gray-400">Level 1</p>
          </div>
        </div>

        <div class="bg-gray-800 p-4 rounded-lg flex justify-between items-center">
          <div>
            <span class="text-xs text-gray-400 font-bold uppercase">Hit Points</span>
            <div class="flex items-baseline gap-1 mt-1">
              <span id="charCurrentHp" class="text-3xl font-black text-green-400">0</span>
              <span class="text-gray-500">/</span>
              <span id="charMaxHp" class="text-xl font-bold">0</span>
            </div>
          </div>
          <div class="w-1/2 bg-gray-700 rounded-full h-4">
            <div id="hpBar" class="bg-green-500 h-full transition-all" style="width: 0%"></div>
          </div>
        </div>

        <div>
          <h3 class="text-sm font-bold text-amber-500 uppercase mb-3">Ability Scores</h3>
          <div class="grid grid-cols-3 gap-2">
            <button class="card text-center p-2 hover:border-amber-500" onclick="rollStat('Strength', 'str')">
              <span class="text-xs text-gray-400">STR</span>
              <span id="statScore-str" class="text-lg font-bold block mt-1">10</span>
            </button>
            <button class="card text-center p-2 hover:border-amber-500" onclick="rollStat('Dexterity', 'dex')">
              <span class="text-xs text-gray-400">DEX</span>
              <span id="statScore-dex" class="text-lg font-bold block mt-1">10</span>
            </button>
            <button class="card text-center p-2 hover:border-amber-500" onclick="rollStat('Constitution', 'con')">
              <span class="text-xs text-gray-400">CON</span>
              <span id="statScore-con" class="text-lg font-bold block mt-1">10</span>
            </button>
            <button class="card text-center p-2 hover:border-amber-500" onclick="rollStat('Intelligence', 'int')">
              <span class="text-xs text-gray-400">INT</span>
              <span id="statScore-int" class="text-lg font-bold block mt-1">10</span>
            </button>
            <button class="card text-center p-2 hover:border-amber-500" onclick="rollStat('Wisdom', 'wis')">
              <span class="text-xs text-gray-400">WIS</span>
              <span id="statScore-wis" class="text-lg font-bold block mt-1">10</span>
            </button>
            <button class="card text-center p-2 hover:border-amber-500" onclick="rollStat('Charisma', 'cha')">
              <span class="text-xs text-gray-400">CHA</span>
              <span id="statScore-cha" class="text-lg font-bold block mt-1">10</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- CENTER COLUMN: Map & Tokens -->
    <div class="lg:col-span-6">
      <div class="card">
        <div class="flex justify-between items-center mb-4">
          <h2 class="card-title">🗺️ Tactical Map</h2>
          <button id="addTokenBtn" class="btn btn-success">+ Place Token</button>
        </div>
        
        <div class="flex gap-2 mb-4">
          <input type="text" id="mapUrlInput" placeholder="Map Image URL..." class="input flex-1" />
          <button id="setMapBtn" class="btn btn-primary">Set Map</button>
        </div>

        <div id="mapContainer" class="relative w-full aspect-square bg-gray-950 border border-gray-800 rounded-lg overflow-hidden vtt-grid"></div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Dice & Log -->
    <div class="lg:col-span-3 flex flex-col gap-6">
      <div class="card">
        <h2 class="card-title">🎲 Dice Tray</h2>
        
        <div class="grid grid-cols-4 gap-2 mb-4">
          <button onclick="rollDice(4)" class="btn btn-secondary text-xs">d4</button>
          <button onclick="rollDice(6)" class="btn btn-secondary text-xs">d6</button>
          <button onclick="rollDice(8)" class="btn btn-secondary text-xs">d8</button>
          <button onclick="rollDice(10)" class="btn btn-secondary text-xs">d10</button>
          <button onclick="rollDice(12)" class="btn btn-secondary text-xs">d12</button>
          <button onclick="rollDice(20)" class="btn btn-secondary text-xs">d20</button>
          <button onclick="rollDice(100)" class="btn btn-secondary text-xs">d100</button>
          <button onclick="openCustomRoll()" class="btn btn-secondary text-xs">Custom</button>
        </div>

        <div id="customRollForm" class="hidden border-t pt-3">
          <div class="flex gap-2">
            <input type="text" id="customRollInput" placeholder="e.g. 2d6+4" class="input flex-1" />
            <button onclick="executeCustomRoll()" class="btn btn-accent">Roll</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">🎥 OBS Overlay</h2>
        <p class="text-xs text-gray-400 mb-2">Add this as Browser Source in OBS</p>
        <div class="flex gap-2">
          <input type="text" id="obsUrlInput" readonly class="input flex-1 text-xs" />
          <button onclick="copyObsUrl()" class="btn btn-secondary">Copy</button>
        </div>
      </div>

      <div class="card flex-1 flex flex-col min-h-[300px]">
        <div class="flex justify-between items-center mb-3">
          <h2 class="card-title">📜 Game Log</h2>
          <button onclick="clearLog()" class="text-xs text-gray-500 hover:text-gray-300">Clear</button>
        </div>
        
        <div id="logContainer" class="flex-1 bg-gray-950 border border-gray-800 rounded p-3 overflow-y-auto max-h-[350px] space-y-2 text-sm">
          <div class="text-gray-500 italic">No rolls yet. Join a room!</div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/components.js"></script>
  <script src="/js/theme-toggle.js"></script>
  <script src="/js/shortcuts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
