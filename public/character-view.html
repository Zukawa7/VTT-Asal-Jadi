<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet - VTT Asal Jadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --red:#bd3034; --dark:#303030; --muted:#77838a; --line:#d89a9d; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:#111; font-family:'Barlow Condensed',Arial,sans-serif; font-size:20px; }
    button { font:inherit; cursor:pointer; }
    .top { background:var(--dark); color:#fff; border-bottom:4px solid #777; padding:12px 26px 20px; }
    .top-main { display:grid; grid-template-columns:145px 1fr 120px 145px 265px; align-items:center; gap:22px; max-width:1400px; margin:auto; }
    .portrait { width:145px; height:145px; border:4px solid var(--red); border-radius:9px; object-fit:cover; background:#444; }
    .name { font-size:54px; line-height:.95; font-weight:500; }
    .subtitle { color:#aab2b5; font-size:30px; margin-top:12px; }
    .level { font-size:32px; margin-top:4px; }
    .manage,.icon-btn,.summary-box,.inspiration { border:3px solid var(--red); border-radius:9px; background:transparent; color:#fff; text-align:center; }
    .manage { padding:13px 12px; font-size:26px; }
    .icon-btn { height:100px; font-size:45px; }
    .summary { display:grid; gap:10px; }
    .summary-box { padding:10px; font-size:24px; }
    .hp-value { font-size:54px; line-height:1; margin-top:5px; }
    .inspiration { padding:8px; font-size:24px; }
    .combat { max-width:1400px; margin:auto; display:grid; grid-template-columns:repeat(4,1fr) 1.25fr; align-items:center; gap:18px; padding:16px 25px 20px; }
    .combat-item { text-align:center; }
    .combat-label { font-size:25px; font-weight:700; text-transform:uppercase; }
    .combat-value { font-size:64px; line-height:1; }
    .combat-value small { color:var(--muted); font-size:48px; }
    .initiative { border:3px solid #b8c7d2; border-radius:14px; padding:10px; }
    .side-buttons { display:grid; gap:12px; }
    .side-buttons button { background:#fff; border:3px solid var(--red); border-radius:9px; padding:14px; font-weight:700; color:#222; }
    .campaign { border-top:4px solid var(--red); border-bottom:3px solid #dfb2b4; padding:34px 3%; }
    .campaign-inner { max-width:1210px; margin:auto; border:3px solid var(--red); border-radius:10px; padding:16px; text-align:center; font-size:33px; }
    .campaign-inner span { font-weight:700; }
    main { max-width:1400px; margin:auto; padding:35px 4%; }
    .ability-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:48px 14%; }
    .ability { position:relative; border:4px solid var(--red); border-radius:28px 18px 30px 18px; padding:22px 18px 38px; text-align:center; background:#fff; }
    .ability:after { content:''; position:absolute; inset:7px -7px -8px 7px; border:2px solid var(--red); border-radius:20px; pointer-events:none; }
    .ability h2 { color:var(--muted); margin:0 0 12px; font-size:30px; text-transform:uppercase; }
    .modifier { border:3px solid #c4ced5; border-radius:12px; padding:8px; font-size:57px; line-height:1; color:#111; }
    .modifier::first-letter { color:#777; }
    .score { display:inline-block; position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); background:#fff; border:4px solid var(--red); border-radius:50%; padding:12px 27px; font-size:45px; font-weight:700; z-index:2; }
    .panel { margin-top:65px; border:4px solid var(--line); border-radius:25px; padding:32px 7%; text-align:center; }
    .panel h2 { margin:0 0 28px; font-size:37px; }
    .save-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 70px; max-width:850px; margin:auto; }
    .save { display:flex; align-items:center; gap:12px; }
    .dot { width:20px; height:20px; border:2px dotted #777; border-radius:50%; flex:none; }
    .dot.on { background:#333; border-style:solid; }
    .save-label { flex:1; border-top:3px solid var(--line); border-bottom:3px solid var(--line); padding:7px; font-weight:700; font-size:25px; }
    .save-value { border:3px solid var(--line); border-radius:50%; padding:7px 20px; font-size:28px; color:#555; }
    .hint { color:var(--muted); margin-top:22px; font-size:24px; }
    .sense-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:30px; max-width:760px; margin:auto; }
    .sense-value { color:#222; border:3px solid var(--line); border-radius:50%; padding:12px 25px; font-size:32px; display:inline-block; }
    .sense-label { display:block; font-size:25px; font-weight:700; margin-top:10px; }
    .actions { display:flex; justify-content:center; gap:10px; margin:30px 0; }
    .actions button { background:var(--red); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-weight:700; }
    #error { display:none; text-align:center; padding:80px; color:var(--red); }
    /* Keep the fixed-width composition used by the reference sheet. */
    @media (max-width:560px) {
      html, body { min-width:1100px; }
      body { overflow-x:auto; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-main">
      <img id="avatar" class="portrait" alt="Character portrait">
      <div><div id="name" class="name">Character</div><div id="subtitle" class="subtitle">Race Class</div><div id="level" class="level">Level 1</div></div>
      <button class="manage" onclick="window.location.href='/dashboard'">MANAGE</button>
      <button class="icon-btn" title="Export" onclick="downloadCharacterJson()">☷</button>
      <div class="summary"><div class="summary-box">HIT POINTS<div id="hp" class="hp-value">0 / 0</div></div><div class="inspiration">HEROIC INSPIRATION</div></div>
    </div>
    <div class="combat">
      <div class="combat-item"><div class="combat-label">PROFICIENCY<br> BONUS</div><div id="prof" class="combat-value">+2</div></div>
      <div class="combat-item"><div class="combat-label" style="color:var(--muted)">WALKING<br> SPEED</div><div class="combat-value">30<small> ft.</small></div></div>
      <div class="combat-item initiative"><div class="combat-value" id="initiative">+0</div><div class="combat-label">INITIATIVE</div></div>
      <div class="combat-item"><div class="combat-label">ARMOR<br> CLASS</div><div class="combat-value" id="armor">10</div></div>
      <div class="side-buttons"><button>DEFENSES</button><button>CONDITIONS</button></div>
    </div>
  </header>

  <div class="campaign"><div class="campaign-inner"><span>CAMPAIGN:</span> <span id="campaign">No campaign assigned</span></div></div>
  <main id="sheet" style="display:none">
    <div class="actions"><button onclick="copyCharacterJson()">COPY JSON</button><button onclick="downloadCharacterJson()">DOWNLOAD JSON</button></div>
    <section id="abilities" class="ability-grid"></section>
    <section class="panel"><h2>SAVING THROWS ⚙</h2><div id="saves" class="save-grid"></div><div class="hint">You have no saving throw modifiers</div></section>
    <section class="panel"><h2>PASSIVE SENSES ⚙</h2><div id="senses" class="sense-grid"></div><div class="hint">Additional Sense Types</div></section>
  </main>
  <div id="loading" style="text-align:center;padding:80px">Loading character sheet...</div><div id="error"></div>

  <script>
    let character = null;
    const parts = location.pathname.split('/');
    const username = parts[1];
    const characterId = parts[4];
    const names = {str:'STRENGTH',dex:'DEXTERITY',con:'CONSTITUTION',int:'INTELLIGENCE',wis:'WISDOM',cha:'CHARISMA'};
    const statIds = {str:1,dex:2,con:3,int:4,wis:5,cha:6};
    const mod = n => Math.floor((n - 10) / 2);
    const signed = n => n >= 0 ? `+${n}` : `${n}`;

    async function loadCharacter() {
      try {
        const response = await fetch(`/api/character/${encodeURIComponent(username)}/${encodeURIComponent(characterId)}`);
        if (!response.ok) throw new Error('Character not found or unavailable.');
        character = await response.json(); render(character);
      } catch (e) { document.getElementById('loading').style.display='none'; const error=document.getElementById('error'); error.textContent=e.message; error.style.display='block'; }
    }
    function render(c) {
      document.getElementById('loading').style.display='none'; document.getElementById('sheet').style.display='block';
      document.getElementById('avatar').src=c.avatarUrl || '';
      document.getElementById('name').textContent=c.name;
      document.getElementById('subtitle').textContent=`${c.race} ${c.classes.map(x=>x.name).join(' / ')}`;
      document.getElementById('level').textContent=`Level ${c.level}`;
      document.getElementById('hp').textContent=`${c.hp.current} / ${c.hp.max}`;
      document.getElementById('prof').textContent=signed(2 + Math.floor((c.level-1)/4));
      document.getElementById('initiative').textContent=signed(c.modifiers.dex);
      document.getElementById('armor').textContent=10+c.modifiers.dex;
      const abilities=document.getElementById('abilities');
      abilities.innerHTML=Object.entries(names).map(([key,label])=>`<div class="ability"><h2>${label}</h2><div class="modifier">${signed(c.modifiers[key])}</div><div class="score">${c.stats[key]}</div></div>`).join('');
      document.getElementById('saves').innerHTML=Object.entries(names).map(([key,label])=>`<div class="save"><span class="dot"></span><span class="save-label">${label.slice(0,3)}</span><span class="save-value">${signed(c.modifiers[key])}</span></div>`).join('');
      const senses=[['PERCEPTION',10+c.modifiers.wis],['INVESTIGATION',10+c.modifiers.int],['INSIGHT',10+c.modifiers.wis]];
      document.getElementById('senses').innerHTML=senses.map(x=>`<div><span class="sense-value">${x[1]}</span><span class="sense-label">${x[0]}</span></div>`).join('');
    }
    function copyCharacterJson(){ if(character) navigator.clipboard.writeText(JSON.stringify(character,null,2)); }
    function downloadCharacterJson(){ if(!character)return; const a=document.createElement('a'); a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(character,null,2)); a.download=(character.name||'character').replace(/\s+/g,'_')+'.json'; a.click(); }
    loadCharacter();
  </script>
</body>
</html>
<!-- Character sheet visual layout inspired by the supplied reference image. -->
