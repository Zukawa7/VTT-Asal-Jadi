name: Auto Deploy to Main Server

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger Deploy Webhook
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and rebuild native SQLite binding
        run: |
          npm install --include=dev
          npm rebuild sqlite3 --build-from-source

      - name: Verify before deploy
        run: |
          npm run type-check
          npm run lint
          npm run build
          npm test

      - name: Send Webhook request
        run: |
          # The webhook secret is used to generate the signature
          # We calculate the HMAC SHA256 of the payload and send it in the header
          PAYLOAD='{"ref": "refs/heads/main", "after": "${{ github.sha }}"}'
          SECRET="${{ secrets.WEBHOOK_SECRET }}"
          
          if [ -z "$SECRET" ]; then
            echo "Error: WEBHOOK_SECRET is not set in GitHub Secrets."
            exit 1
          fi
          
          # Calculate signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | cut -d' ' -f2)
          
          # Send POST request to the main server webhook endpoint (exposed via Cloudflare Tunnel)
          curl --fail-with-body --retry 4 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 240 -X POST \
            -H "Content-Type: application/json" \
            -H "x-hub-signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD" \
            "${{ secrets.SERVER_WEBHOOK_URL }}"

      - name: Verify production health after deployment
        env:
          SERVER_HEALTH_URL: ${{ secrets.SERVER_HEALTH_URL }}
        run: |
          if [ -z "$SERVER_HEALTH_URL" ]; then
            echo "SERVER_HEALTH_URL is not configured; skipping remote health check."
            echo "Recommended value: https://vtt.polyport.my.id/health"
            exit 0
          fi

          curl --fail-with-body --retry 12 --retry-delay 5 --retry-connrefused \
            --connect-timeout 15 --max-time 30 "$SERVER_HEALTH_URL"
